name: Run Tests

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
            
            - name: Set up conda
              uses: actions/setup-conda@v3
              with:
                activate-environment: Poke_Img
                environment-file: environment.yml
                python-version: '3.12'
                auto-activate-base: false
            

            - name: Install dependencies
              shell: bash -el {0}
              run: pip install -r requirements.txt
            

            - name: Run tests
              shell: bash -el {0}
              run: pytest tests/